# Amplify Hosting: connect this repo (main) in Console → Amplify Gen 1 → Hosting.
# Static HTML at repo root — no npm/yarn install.
version: 1
customHeaders:
  - pattern: '/favicon.ico'
    headers:
      - key: Content-Type
        value: image/png
frontend:
  phases:
    build:
      commands:
        - echo "Publishing static HTML from repository root."
  artifacts:
    baseDirectory: .
    files:
      - "**/*"
